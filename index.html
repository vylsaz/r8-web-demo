    <style>
        /* Remove browser default margins and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Prevent scrollbars and fix body dimensions */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #181818;
        }

        /* Make canvas behave as a block element */
        canvas {
            display: block;
            position: absolute;
            image-rendering: pixelated;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
